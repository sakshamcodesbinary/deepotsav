<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a3a">
<meta name="description" content="Light diyas and burst crackers in a virtual Diwali night.">
<title>एक दिवाली सब के साथ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/game.css">
</head>
<body class="play">
<canvas id="stage" role="img" aria-label="Night courtyard decorated with lights and diyas"></canvas>

<header class="topbar">
  <button class="kharchi" data-open-kharchi type="button"><span>Diwali Ki Kharchi</span></button>
  <a class="brand" href="/" data-i18n-aria="home"><span data-i18n="brand1"></span> <span data-i18n="brand2"></span></a>
  <div class="controls" id="controls"></div>
</header>

<nav class="tray" id="tray" aria-label="Crackers">
  <button class="cracker" data-type="rocket" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><rect x="23" y="30" width="2" height="28" fill="#a9743c"/><rect x="18" y="12" width="12" height="22" fill="#d8283a"/><rect x="18" y="12" width="4" height="22" fill="#fff" opacity=".2"/><rect x="18" y="20" width="12" height="3" fill="#ffd34d"/><path d="M18 12L24 2l6 10z" fill="#ffd34d"/><path d="M18 30l-6 8h6zM30 30l6 8h-6z" fill="#8f1c28"/></svg>
    <span data-i18n="rocket"></span></button>
  <button class="cracker" data-type="skyshot" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><rect x="23" y="30" width="2" height="28" fill="#a9743c"/><rect x="18" y="12" width="12" height="22" fill="#2b5fd6"/><rect x="18" y="12" width="4" height="22" fill="#fff" opacity=".2"/><path d="M18 12L24 3l6 9z" fill="#dfe6f5"/><path d="M24 17l1.6 3.4 3.7.4-2.8 2.5.8 3.6-3.3-1.9-3.3 1.9.8-3.6-2.8-2.5 3.7-.4z" fill="#ffd34d"/><g stroke="#ffd34d" stroke-width="1.6" stroke-linecap="round"><path d="M9 6l4 3M39 6l-4 3M6 16h5M42 16h-5"/></g></svg>
    <span data-i18n="skyshot"></span></button>
  <button class="cracker" data-type="fuljhari" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><rect x="23.2" y="22" width="1.6" height="36" fill="#9aa0a6"/><rect x="21.5" y="14" width="5" height="22" fill="#34343f"/><g stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round"><path d="M24 11V3M24 11l-7-6M24 11l7-6M24 11l-9-1M24 11l9-1M24 11l-6 6M24 11l6 6"/></g><circle cx="24" cy="12" r="2.4" fill="#fff6c0"/></svg>
    <span data-i18n="fuljhari"></span></button>
  <button class="cracker" data-type="charkhi" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><g transform="translate(24 38) scale(1 .5)"><path d="M0 0L22 0A22 22 0 0 1 -11 19.05z" fill="#d8283a"/><path d="M0 0L-11 19.05A22 22 0 0 1 -11 -19.05z" fill="#ffd34d"/><path d="M0 0L-11 -19.05A22 22 0 0 1 22 0z" fill="#2a9d8f"/><circle r="22" fill="none" stroke="#2b0f05" stroke-width="2"/><circle r="3.4" fill="#2b0f05"/></g><g stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round"><path d="M42 30l4-3M6 30l-4-3M30 22l2-5M18 22l-2-5"/></g></svg>
    <span data-i18n="charkhi"></span></button>
  <button class="cracker" data-type="anaar" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><path d="M10 56l3-26h22l3 26z" fill="#b5532a"/><path d="M10 56l3-26h6l-1 26z" fill="#fff" opacity=".16"/><path d="M11.6 46l.7-8h23.4l.7 8z" fill="#d8283a"/><ellipse cx="24" cy="30" rx="11" ry="3" fill="#2a1208"/><g stroke-linecap="round" stroke-width="1.8"><path d="M24 26V8" stroke="#ffd34d"/><path d="M22 26L14 10M26 26l8-16" stroke="#9dff7a"/><path d="M20 27L9 18M28 27l11-9" stroke="#ff5d8f"/></g></svg>
    <span data-i18n="anaar"></span></button>
  <button class="cracker" data-type="bomb" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><defs><radialGradient id="bm" cx=".35" cy=".3"><stop offset="0" stop-color="#70707a"/><stop offset="1" stop-color="#101014"/></radialGradient></defs><circle cx="23" cy="38" r="17" fill="url(#bm)"/><rect x="18" y="19" width="10" height="5" fill="#8a8a92"/><path d="M23 19q2-9 10-10" stroke="#d9b36a" stroke-width="2.4" fill="none" stroke-linecap="round"/><g stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round"><path d="M35 9l5-4M35 9l1-6M35 9l6 1"/></g></svg>
    <span data-i18n="bomb"></span></button>
  <button class="cracker special" data-type="jethelal" type="button">
    <svg viewBox="0 0 48 60" aria-hidden="true"><defs><linearGradient id="jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fa3"/><stop offset="1" stop-color="#ffc94d"/></linearGradient></defs><path d="M24 8l17.3 10v20L24 48 6.7 38V18z" fill="url(#jg)" stroke="#fff3c8" stroke-width="2"/><path d="M24 15l11 6.4v12.8L24 41l-11-6.8V21.4z" fill="none" stroke="#fff" stroke-opacity=".6"/><path d="M24 21l2.2 4.8 5.2.5-3.9 3.5 1.1 5.1-4.6-2.6-4.6 2.6 1.1-5.1-3.9-3.5 5.2-.5z" fill="#fff6c0"/></svg>
    <span data-i18n="jethelal"></span></button>
</nav>

<div class="diyachip" id="diyaChip">
  <span data-i18n="diyas"></span>
  <b><span id="diyaCount">0</span>/<span id="diyaTotal"></span></b>
  <button type="button" id="lightAll" data-i18n="lightAll"></button>
</div>

<p class="hint" id="hint" data-i18n="hint"></p>
<p class="crowd"><span data-i18n="crowd"></span> <b id="crowdN" data-base="0">0</b></p>

<noscript><p class="nojs">This game needs JavaScript. / इस खेल के लिए JavaScript चाहिए।</p></noscript>
<script type="module" src="/js/game.js"></script>
</body>
</html>
